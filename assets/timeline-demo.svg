<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="RecallLocal Time-Machine Scrubber and OCR Highlight Demo">
  <defs>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="amberBoxGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ui { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
      @keyframes amberPulse {
        0%, 100% { fill-opacity: 0.24; stroke-opacity: 0.95; }
        50% { fill-opacity: 0.42; stroke-opacity: 1; }
      }
      @keyframes playheadGlide {
        0%, 100% { transform: translateX(0px); }
        45% { transform: translateX(340px); }
        55% { transform: translateX(340px); }
      }
      @keyframes toastFade {
        0%, 15% { opacity: 0; transform: translateY(8px); }
        25%, 80% { opacity: 1; transform: translateY(0px); }
        92%, 100% { opacity: 0; transform: translateY(6px); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .amber-hit { animation: amberPulse 2.2s ease-in-out infinite; }
      .playhead { animation: playheadGlide 7s ease-in-out infinite; }
      .toast { animation: toastFade 4.5s ease-in-out infinite; }
      .caret { animation: cursorBlink 1.1s steps(1) infinite; }
    </style>
  </defs>

  <!-- Outer Backdrop -->
  <rect x="0" y="0" width="1120" height="560" rx="16" fill="#06080B"/>

  <!-- Main Obsidian Spotlight Window -->
  <g transform="translate(24, 20)" filter="url(#windowShadow)">
    <rect x="0" y="0" width="1072" height="520" rx="14" fill="#090B0E" stroke="#232A36" stroke-width="1.2"/>

    <!-- Top Spotlight Header Bar -->
    <path d="M14,0 H1058 A14,14 0 0 1 1072,14 V62 H0 V14 A14,14 0 0 1 14,0 Z" fill="#12161E"/>
    <line x1="0" y1="62" x2="1072" y2="62" stroke="#232A36" stroke-width="1"/>

    <!-- Brand Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#090B0E" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="33" cy="31" r="5" fill="#38BDF8"/>
    <text x="58" y="29" class="ui" font-size="14" font-weight="700" fill="#F1F5F9">RecallLocal</text>
    <circle cx="62" cy="43" r="3.5" fill="#10B981"/>
    <text x="71" y="47" class="ui" font-size="10.5" font-weight="600" fill="#10B981">Privacy Shield Active</text>

    <!-- Spotlight Search Input -->
    <rect x="208" y="13" width="470" height="36" rx="9" fill="#090B0E" stroke="#38BDF8" stroke-width="1"/>
    <text x="224" y="36" class="ui" font-size="15" fill="#38BDF8">⌕</text>
    <text x="246" y="35" class="ui" font-size="13.5" fill="#F1F5F9">Windows.Media.Ocr</text>
    <rect class="caret" x="378" y="21" width="2" height="19" fill="#38BDF8"/>
    <rect x="558" y="19" width="110" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
    <text x="568" y="35" class="ui" font-size="11" font-weight="600" fill="#38BDF8">14 moments found</text>

    <!-- Quick Action Buttons -->
    <rect x="692" y="15" width="132" height="32" rx="7" fill="#181E29" stroke="#232A36"/>
    <text x="706" y="35" class="ui" font-size="11.5" font-weight="600" fill="#F1F5F9">Copy All Screen Text</text>

    <rect x="832" y="15" width="106" height="32" rx="7" fill="#2A1419" stroke="#7F1D1D"/>
    <text x="845" y="35" class="ui" font-size="11.5" font-weight="600" fill="#FCA5A5">Nuke Last 15m</text>

    <rect x="946" y="15" width="70" height="32" rx="7" fill="#181E29" stroke="#232A36"/>
    <text x="963" y="35" class="ui" font-size="11.5" font-weight="600" fill="#F1F5F9">Pause</text>

    <rect x="1024" y="15" width="32" height="32" rx="7" fill="#181E29" stroke="#232A36"/>
    <text x="1035" y="35" class="ui" font-size="13" font-weight="700" fill="#94A3B8">✕</text>

    <!-- App Filter Pills Strip -->
    <rect x="0" y="63" width="1072" height="40" fill="#0D1117"/>
    <line x1="0" y1="103" x2="1072" y2="103" stroke="#232A36" stroke-width="1"/>

    <g transform="translate(18, 71)">
      <rect x="0" y="0" width="44" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
      <text x="14" y="16" class="ui" font-size="11.5" font-weight="600" fill="#CBD5E1">All</text>

      <rect x="52" y="0" width="76" height="24" rx="6" fill="#0EA5E9" stroke="#38BDF8"/>
      <text x="66" y="16" class="ui" font-size="11.5" font-weight="700" fill="#090B0E">VS Code</text>

      <rect x="136" y="0" width="72" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
      <text x="150" y="16" class="ui" font-size="11.5" font-weight="600" fill="#CBD5E1">Chrome</text>

      <rect x="216" y="0" width="78" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
      <text x="230" y="16" class="ui" font-size="11.5" font-weight="600" fill="#CBD5E1">Terminal</text>

      <rect x="302" y="0" width="78" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
      <text x="316" y="16" class="ui" font-size="11.5" font-weight="600" fill="#CBD5E1">Obsidian</text>

      <!-- Date Pills on Right -->
      <rect x="854" y="0" width="66" height="24" rx="6" fill="#0EA5E9" stroke="#38BDF8"/>
      <text x="868" y="16" class="ui" font-size="11" font-weight="700" fill="#090B0E">Today</text>

      <rect x="928" y="0" width="108" height="24" rx="6" fill="#181E29" stroke="#232A36"/>
      <text x="942" y="16" class="ui" font-size="11" font-weight="600" fill="#94A3B8">All 7 Days</text>
    </g>

    <!-- Main Historical Screenshot Viewport -->
    <rect x="18" y="116" width="1036" height="286" rx="10" fill="#0C1016" stroke="#232A36"/>

    <!-- Simulated Historical VS Code Frame -->
    <g transform="translate(34, 128)">
      <rect x="0" y="0" width="1004" height="262" rx="6" fill="#0F141B" stroke="#1E2736"/>
      <!-- Sidebar -->
      <rect x="0" y="0" width="190" height="262" rx="6" fill="#121821"/>
      <line x1="190" y1="0" x2="190" y2="262" stroke="#1E2736"/>
      <text x="16" y="26" class="mono" font-size="11" fill="#64748B">EXPLORER</text>
      <text x="16" y="52" class="mono" font-size="11.5" fill="#94A3B8">▾ src/RecallLocal</text>
      <text x="28" y="74" class="mono" font-size="11.5" fill="#94A3B8">  CaptureService.cs</text>
      <rect x="8" y="84" width="174" height="22" rx="4" fill="#1A2433"/>
      <text x="28" y="99" class="mono" font-size="11.5" fill="#38BDF8">  OcrService.cs</text>
      <text x="28" y="122" class="mono" font-size="11.5" fill="#94A3B8">  VaultStore.cs</text>
      <text x="28" y="144" class="mono" font-size="11.5" fill="#94A3B8">  PrivacyGuard.cs</text>

      <!-- Editor Code Content -->
      <text x="214" y="30" class="mono" font-size="11.5" fill="#64748B">1   using System.Threading.Tasks;</text>
      <text x="214" y="54" class="mono" font-size="11.5" fill="#E2E8F0">2   using Windows.Media.Ocr;</text>
      <text x="214" y="78" class="mono" font-size="11.5" fill="#94A3B8">3   using Windows.Graphics.Imaging;</text>
      <text x="214" y="106" class="mono" font-size="11.5" fill="#E2E8F0">4   public async Task&lt;OcrExtractionResult&gt; RecognizeAsync(Bitmap bitmap)</text>
      <text x="214" y="130" class="mono" font-size="11.5" fill="#94A3B8">5   {</text>
      <text x="214" y="154" class="mono" font-size="11.5" fill="#E2E8F0">6       // Native offline Windows.Media.Ocr — English &amp; العربية supported</text>
      <text x="214" y="178" class="mono" font-size="11.5" fill="#E2E8F0">7       OcrResult result = await _primaryEngine.RecognizeAsync(softwareBitmap);</text>
      <text x="214" y="202" class="mono" font-size="11.5" fill="#94A3B8">8       return ExtractNormalizedWordBoxes(result, bitmap.Width, bitmap.Height);</text>
      <text x="214" y="226" class="mono" font-size="11.5" fill="#94A3B8">9   }</text>

      <!-- Glowing Amber #F59E0B OCR Bounding-Box Highlights -->
      <rect class="amber-hit" x="281" y="39" width="136" height="21" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.8" filter="url(#amberBoxGlow)"/>
      <rect class="amber-hit" x="394" y="139" width="136" height="21" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.8" filter="url(#amberBoxGlow)"/>

      <!-- Click-to-Copy Toast Confirmation -->
      <g class="toast" transform="translate(370, 214)">
        <rect x="0" y="0" width="286" height="34" rx="8" fill="#12161E" stroke="#10B981" stroke-width="1.2"/>
        <text x="16" y="21" class="ui" font-size="12" font-weight="600" fill="#10B981">✓ Copied "Windows.Media.Ocr" to clipboard</text>
      </g>
    </g>

    <!-- Bottom Visual Timeline Scrubber -->
    <path d="M0,414 H1072 V506 A14,14 0 0 1 1058,520 H14 A14,14 0 0 1 0,506 Z" fill="#12161E"/>
    <line x1="0" y1="414" x2="1072" y2="414" stroke="#232A36" stroke-width="1"/>

    <!-- Frame Metadata Line -->
    <rect x="18" y="424" width="96" height="22" rx="5" fill="#181E29" stroke="#38BDF8"/>
    <text x="28" y="439" class="mono" font-size="11" font-weight="700" fill="#38BDF8">10:42:15 AM</text>
    <text x="124" y="439" class="ui" font-size="11.5" fill="#94A3B8">Today</text>
    <rect x="168" y="424" width="66" height="22" rx="5" fill="#181E29" stroke="#232A36"/>
    <text x="180" y="439" class="ui" font-size="11.5" font-weight="600" fill="#F1F5F9">VS Code</text>
    <text x="246" y="439" class="ui" font-size="12" fill="#94A3B8">OcrService.cs — recall-local — Visual Studio Code</text>
    <text x="802" y="439" class="ui" font-size="11" fill="#64748B">Click any highlighted word to copy  •  ← / → to scrub</text>

    <!-- Scrubber Track -->
    <rect x="18" y="458" width="1036" height="6" rx="3" fill="#1F2735"/>
    <rect x="18" y="458" width="680" height="6" rx="3" fill="#38BDF8" opacity="0.6"/>
    <g class="playhead">
      <circle cx="340" cy="461" r="8" fill="#38BDF8" stroke="#090B0E" stroke-width="2.5"/>
    </g>

    <!-- Clickable Timestamp Ticks -->
    <g transform="translate(18, 474)">
      <rect x="0" y="0" width="94" height="34" rx="5" fill="#090B0E" stroke="#232A36"/>
      <text x="10" y="14" class="mono" font-size="10" fill="#94A3B8">10:32 AM</text>
      <text x="10" y="27" class="ui" font-size="9.5" fill="#64748B">Chrome</text>

      <rect x="104" y="0" width="94" height="34" rx="5" fill="#090B0E" stroke="#232A36"/>
      <text x="114" y="14" class="mono" font-size="10" fill="#94A3B8">10:36 AM</text>
      <text x="114" y="27" class="ui" font-size="9.5" fill="#64748B">Terminal</text>

      <rect x="208" y="0" width="94" height="34" rx="5" fill="#090B0E" stroke="#232A36"/>
      <text x="218" y="14" class="mono" font-size="10" fill="#94A3B8">10:39 AM</text>
      <text x="218" y="27" class="ui" font-size="9.5" fill="#64748B">VS Code</text>

      <rect x="312" y="0" width="98" height="34" rx="5" fill="#1D2B3A" stroke="#38BDF8"/>
      <text x="322" y="14" class="mono" font-size="10" font-weight="700" fill="#38BDF8">10:42 AM</text>
      <text x="322" y="27" class="ui" font-size="9.5" fill="#E2E8F0">VS Code</text>

      <rect x="420" y="0" width="94" height="34" rx="5" fill="#090B0E" stroke="#232A36"/>
      <text x="430" y="14" class="mono" font-size="10" fill="#94A3B8">10:45 AM</text>
      <text x="430" y="27" class="ui" font-size="9.5" fill="#64748B">Obsidian</text>

      <rect x="524" y="0" width="94" height="34" rx="5" fill="#090B0E" stroke="#232A36"/>
      <text x="534" y="14" class="mono" font-size="10" fill="#94A3B8">10:48 AM</text>
      <text x="534" y="27" class="ui" font-size="9.5" fill="#64748B">Chrome</text>
    </g>
  </g>
</svg>
