<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D" />
      <stop offset="55%" stop-color="#0B111C" />
      <stop offset="100%" stop-color="#08161E" />
    </linearGradient>
    <radialGradient id="skyGlow" cx="80%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06080D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#172030" stroke-width="0.9" />
    </pattern>
    <style>
      .scrub-head { animation: scrubMove 5.2s ease-in-out infinite; }
      .pulse { animation: blink 1.6s ease-in-out infinite; }
      .ocr-box { animation: boxGlow 2.6s ease-in-out infinite; }
      @keyframes scrubMove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(220px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes boxGlow {
        0%, 100% { stroke-opacity: 1; fill-opacity: 0.25; }
        50% { stroke-opacity: 0.45; fill-opacity: 0.08; }
      }
    </style>
  </defs>

  <rect width="1200" height="350" rx="20" fill="url(#bg)" />
  <rect width="1200" height="350" rx="20" fill="url(#grid)" />
  <rect width="1200" height="350" rx="20" fill="url(#skyGlow)" />
  <rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#1E293B" stroke-width="2" />

  
  <g transform="translate(60, 44)">
    <rect width="364" height="32" rx="16" fill="#0D1420" stroke="#10B981" stroke-opacity="0.5" />
    <circle class="pulse" cx="18" cy="16" r="5" fill="#10B981" />
    <text x="34" y="21" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13" font-weight="700">100% OFFLINE RECALL // DAY 15 LEAP</text>
  </g>

  
  <text x="60" y="152" fill="url(#titleGrad)" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">RECALLLOCAL</text>
  <text x="62" y="194" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, sans-serif" font-size="21" font-weight="500">Photographic memory &amp; instant OCR search for ANY Windows 10/11 PC.</text>
  <text x="62" y="224" fill="#64748B" font-family="Consolas, monospace" font-size="14">No Copilot+ NPU Required  •  Native WinRT OCR (AR + EN)  •  Zero Cloud  •  Ctrl+Shift+R</text>

  
  <g transform="translate(60, 262)" font-family="Consolas, monospace" font-size="13" font-weight="700">
    <rect x="0" y="0" width="132" height="34" rx="8" fill="#0D1420" stroke="#223044" />
    <text x="16" y="22" fill="#38BDF8">C# .NET 8</text>
    <rect x="144" y="0" width="154" height="34" rx="8" fill="#0D1420" stroke="#223044" />
    <text x="160" y="22" fill="#34D399">WinRT OCR</text>
    <rect x="310" y="0" width="160" height="34" rx="8" fill="#0D1420" stroke="#223044" />
    <text x="326" y="22" fill="#FBBF24">Privacy Guard</text>
    <rect x="482" y="0" width="142" height="34" rx="8" fill="#0D1420" stroke="#223044" />
    <text x="498" y="22" fill="#F87171">Nuke 15m</text>
  </g>

  
  <g transform="translate(744, 62)">
    <rect width="406" height="226" rx="16" fill="#0B0F17" stroke="#263348" stroke-width="2" />
    
    <rect x="18" y="18" width="370" height="34" rx="8" fill="#131A27" stroke="#38BDF8" stroke-opacity="0.6" />
    <text x="32" y="40" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">🔍 Search past screens: <tspan fill="#FBBF24" font-weight="700">EADDRINUSE</tspan></text>

    
    <rect x="18" y="64" width="370" height="96" rx="8" fill="#080B10" stroke="#1E293B" />
    <text x="32" y="90" fill="#64748B" font-family="Consolas, monospace" font-size="11">10:14 AM  •  Windows Terminal  •  Matched 1 word</text>
    <text x="32" y="118" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">Error: listen <tspan fill="#FBBF24" font-weight="700">EADDRINUSE</tspan> :::3000</text>
    <rect class="ocr-box" x="128" y="102" width="84" height="22" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.6" />
    <text x="32" y="146" fill="#34D399" font-family="Consolas, monospace" font-size="11">✓ Click highlighted word to copy from past screen</text>

    
    <text x="18" y="184" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">09:00 AM</text>
    <text x="336" y="184" fill="#38BDF8" font-family="Consolas, monospace" font-size="10">NOW</text>
    <rect x="18" y="194" width="370" height="8" rx="4" fill="#1E293B" />
    <g class="scrub-head">
      <rect x="40" y="188" width="14" height="20" rx="4" fill="#38BDF8" />
    </g>
  </g>
</svg>