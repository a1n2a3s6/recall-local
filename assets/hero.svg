<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="RecallLocal — 100% Offline Windows Photographic Memory &amp; Timeline Search Engine">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E2633" opacity="0.8"/>
    </pattern>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; fill: #F1F5F9; letter-spacing: -0.5px; }
      .sub { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; fill: #94A3B8; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-weight: 600; }
      .badge-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #CBD5E1; }
      @keyframes pulseRing {
        0%, 100% { stroke-opacity: 0.95; transform: scale(1); }
        50% { stroke-opacity: 0.45; transform: scale(1.06); }
      }
      @keyframes scanSweep {
        0% { transform: translateX(-140px); }
        100% { transform: translateX(420px); }
      }
      @keyframes boxPulse {
        0%, 100% { fill-opacity: 0.22; stroke-opacity: 0.95; }
        50% { fill-opacity: 0.38; stroke-opacity: 1; }
      }
      @keyframes scrubMove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(210px); }
      }
      .ring-pulse { transform-origin: 84px 104px; animation: pulseRing 3s ease-in-out infinite; }
      .beam { animation: scanSweep 3.8s linear infinite; }
      .ocr-box { animation: boxPulse 2.4s ease-in-out infinite; }
      .scrub-head { animation: scrubMove 5.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Obsidian Canvas -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="#090B0E" stroke="#232A36" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#dotGrid)"/>

  <!-- Left Brand Block -->
  <g transform="translate(0, 0)">
    <!-- Emblem -->
    <rect x="52" y="72" width="64" height="64" rx="16" fill="#12161E" stroke="#232A36" stroke-width="1.5"/>
    <circle class="ring-pulse" cx="84" cy="104" r="20" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="96 28" filter="url(#cyanGlow)"/>
    <circle cx="84" cy="104" r="7" fill="#10B981"/>

    <!-- Wordmark -->
    <text x="134" y="101" font-size="40" class="title">RecallLocal</text>
    <rect x="366" y="76" width="128" height="24" rx="12" fill="#0B221B" stroke="#10B981" stroke-width="1"/>
    <circle cx="381" cy="88" r="4" fill="#10B981"/>
    <text x="392" y="92" font-size="11.5" font-family="Segoe UI, sans-serif" font-weight="700" fill="#10B981">100% OFFLINE</text>

    <text x="134" y="132" font-size="16" class="sub">Photographic Memory &amp; Timeline Search Engine for Windows 10/11</text>
    <text x="52" y="182" font-size="14.5" class="sub">Open-source alternative to Windows Recall &amp; Rewind — runs on any PC with</text>
    <text x="52" y="204" font-size="14.5" class="sub">native WinRT OCR, perceptual-hash deduplication, and zero cloud telemetry.</text>

    <!-- Capability Pills -->
    <g transform="translate(52, 236)">
      <rect x="0" y="0" width="142" height="32" rx="8" fill="#12161E" stroke="#232A36"/>
      <circle cx="16" cy="16" r="4" fill="#38BDF8"/>
      <text x="28" y="20" class="badge-text">Zero NuGet Bloat</text>

      <rect x="154" y="0" width="144" height="32" rx="8" fill="#12161E" stroke="#232A36"/>
      <circle cx="170" cy="16" r="4" fill="#F59E0B"/>
      <text x="182" y="20" class="badge-text">EN + AR WinRT OCR</text>

      <rect x="310" y="0" width="136" height="32" rx="8" fill="#12161E" stroke="#232A36"/>
      <circle cx="326" cy="16" r="4" fill="#10B981"/>
      <text x="338" y="20" class="badge-text">Privacy Shield</text>

      <rect x="458" y="0" width="146" height="32" rx="8" fill="#12161E" stroke="#232A36"/>
      <text x="472" y="20" class="mono" font-size="11.5" fill="#38BDF8">Ctrl + Shift + R</text>
    </g>

    <!-- Footer Telemetry Line -->
    <text x="52" y="314" class="mono" font-size="12" fill="#64748B">.NET 8 WPF  •  Single-File EXE  •  ~60 KB / frame  •  &lt;10 ms Local Search</text>
  </g>

  <!-- Right Live Preview Card -->
  <g transform="translate(710, 44)">
    <rect x="0" y="0" width="444" height="272" rx="14" fill="#12161E" stroke="#232A36" stroke-width="1.2"/>

    <!-- Top Search Header -->
    <rect x="14" y="14" width="416" height="34" rx="8" fill="#090B0E" stroke="#232A36"/>
    <text x="28" y="35" class="mono" font-size="12" fill="#38BDF8">⌕  OcrEngine.RecognizeAsync</text>
    <rect x="334" y="20" width="88" height="22" rx="6" fill="#181E29" stroke="#232A36"/>
    <text x="345" y="35" class="mono" font-size="10.5" fill="#38BDF8">14 matches</text>

    <!-- Mock Captured Frame -->
    <clipPath id="frameClip">
      <rect x="14" y="58" width="416" height="156" rx="8"/>
    </clipPath>
    <rect x="14" y="58" width="416" height="156" rx="8" fill="#0B0F14" stroke="#232A36"/>

    <g clip-path="url(#frameClip)">
      <!-- Code lines inside historical frame -->
      <text x="28" y="86" class="mono" font-size="11.5" fill="#64748B">01</text>
      <text x="54" y="86" class="mono" font-size="11.5" fill="#94A3B8">using Windows.Media.Ocr;</text>

      <text x="28" y="110" class="mono" font-size="11.5" fill="#64748B">02</text>
      <text x="54" y="110" class="mono" font-size="11.5" fill="#E2E8F0">var engine = OcrEngine.TryCreateFromUserProfile();</text>

      <text x="28" y="134" class="mono" font-size="11.5" fill="#64748B">03</text>
      <text x="54" y="134" class="mono" font-size="11.5" fill="#E2E8F0">var res = await engine.RecognizeAsync(bmp);</text>

      <text x="28" y="158" class="mono" font-size="11.5" fill="#64748B">04</text>
      <text x="54" y="158" class="mono" font-size="11.5" fill="#94A3B8">// Normalized word boxes: X, Y, W, H (0.0 - 1.0)</text>

      <text x="28" y="182" class="mono" font-size="11.5" fill="#64748B">05</text>
      <text x="54" y="182" class="mono" font-size="11.5" fill="#10B981">PrivacyGuard: 0 frames captured in InPrivate</text>

      <!-- Glowing Amber OCR Highlight Bounding Boxes -->
      <rect class="ocr-box" x="141" y="96" width="76" height="19" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" filter="url(#amberGlow)"/>
      <rect class="ocr-box" x="210" y="120" width="112" height="19" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5" filter="url(#amberGlow)"/>

      <!-- Animated Cyan Scan Beam -->
      <rect class="beam" x="14" y="58" width="110" height="156" fill="url(#scanBeam)"/>
    </g>

    <!-- Bottom Mini Timeline Scrubber -->
    <text x="16" y="233" class="mono" font-size="10.5" fill="#38BDF8">10:42:15 AM</text>
    <text x="108" y="233" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">VS Code — OcrService.cs</text>
    <text x="372" y="233" class="mono" font-size="10.5" fill="#64748B">14 / 14</text>

    <rect x="16" y="246" width="412" height="6" rx="3" fill="#1F2735"/>
    <rect x="16" y="246" width="248" height="6" rx="3" fill="#38BDF8" opacity="0.65"/>
    <g class="scrub-head">
      <circle cx="110" cy="249" r="7" fill="#38BDF8" stroke="#090B0E" stroke-width="2" filter="url(#cyanGlow)"/>
    </g>
  </g>
</svg>
